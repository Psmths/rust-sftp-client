name: Build

on:
  push:
    branches: [main]
  # Allows starting a build by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes a build that is still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Shown next to the version in the client's status bar.
  RSFTP_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            platform: windows-x86_64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        # Release file names carry the Cargo.toml version.
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=rust-sftp-client-$version-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Same packages as Dockerfile.build (eframe/winit, OpenGL, aws-lc).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake perl pkg-config libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add the static Linux target for the server helper
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build the rsftp-turbo server helper (static)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p rsftp-turbo --target x86_64-unknown-linux-musl

      - name: Check the Windows binary needs no Visual C++ runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        # DLL imports are stored as plain ASCII names in the executable.
        run: |
          $bytes = [IO.File]::ReadAllBytes("target/release/rust-sftp-client.exe")
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          $found = [regex]::Matches($text, '(?i)(vcruntime\d+\.dll|msvcp\d+\.dll|api-ms-win-crt-[a-z0-9-]+\.dll)') |
            ForEach-Object { $_.Value } | Sort-Object -Unique
          if ($found) { throw "Binary depends on the Visual C++ runtime: $($found -join ', ')" }
          Write-Host "No Visual C++ runtime DLL imports found."

      - name: Package (Linux)
        if: runner.os == 'Linux'
        # Tar keeps the executable bit, which artifact zips would drop.
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist package
          cp target/release/rust-sftp-client "package/rust-sftp-client-$version"
          tar -czf "dist/${{ steps.version.outputs.artifact }}.tar.gz" -C package "rust-sftp-client-$version"
          # Server helper: static binary + systemd unit + installer. The binary
          # keeps its plain name, which install.sh and the systemd unit use.
          rm -rf staging/rsftp-turbo
          mkdir -p staging/rsftp-turbo
          cp target/x86_64-unknown-linux-musl/release/rsftp-turbo staging/rsftp-turbo/
          cp crates/turbo-server/dist/* staging/rsftp-turbo/
          tar -czf "dist/rsftp-turbo-$version-linux-x86_64.tar.gz" -C staging rsftp-turbo
          # The bare server binary too, for updating an existing install.
          cp target/x86_64-unknown-linux-musl/release/rsftp-turbo "dist/rsftp-turbo-$version-linux-x86_64"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/rust-sftp-client.exe "dist/${{ steps.version.outputs.artifact }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    # Only pushes to main publish; manual runs just build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check every release file is present
        working-directory: dist
        run: |
          version=$(grep -m1 '^version' ../Cargo.toml | cut -d '"' -f2)
          for file in \
            "rust-sftp-client-$version-linux-x86_64.tar.gz" \
            "rust-sftp-client-$version-windows-x86_64.exe" \
            "rsftp-turbo-$version-linux-x86_64.tar.gz" \
            "rsftp-turbo-$version-linux-x86_64"; do
            test -s "$file" || { echo "::error::missing release file $file"; ls -la; exit 1; }
          done

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum rust-sftp-client-* rsftp-turbo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign checksums
        working-directory: dist
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        # The client's updater installs a release only if SHA256SUMS.txt.sig is a
        # valid ed25519 signature by this key (its public half is in src/update.rs).
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::the UPDATE_SIGNING_KEY secret is not set"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/update-signing-key.pub"
          rm -f "$key"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update-signing-key.pub" \
            -in SHA256SUMS.txt -sigfile SHA256SUMS.txt.sig

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # One release per push, e.g. tag v0.5.4-build.42 for Cargo.toml version
        # 0.5.4 and workflow run 42. Notes list the changes since the previous
        # release. gh uploads the assets before publishing the release.
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "rust-sftp-client ${version} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes \
            --latest
