[package]
name = "rust-sftp-client"
version = "0.1.0"
description = "A desktop SFTP client with resumable segmented downloads"
authors = ["Psmths"]
edition = "2021"

[lib]
name = "rust_sftp_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
russh = { version = "0.63.3", features = ["aws-lc-rs"] }
russh-sftp = "3.0.1"
