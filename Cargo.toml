[package]
name = "rust-sftp-client"
version = "0.1.0"
description = "A native Rust desktop SFTP client with resumable segmented downloads"
authors = ["Psmths"]
edition = "2021"

[[bin]]
name = "rust-sftp-client"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
russh = { version = "0.63.3", features = ["aws-lc-rs"] }
russh-sftp = "3.0.1"
# Versions match the ones russh already pulls in (see Cargo.lock).
md5 = "0.8"
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
