[package]
name = "rust-sftp-client"
version = "0.5.3"
description = "A native Rust desktop SFTP client with resumable segmented downloads"
authors = ["Psmths"]
edition = "2021"

[[bin]]
name = "rust-sftp-client"
path = "src/main.rs"

[workspace]
members = [".", "crates/turbo-proto", "crates/turbo-server"]
# `cargo build` / `cargo run` at the top level build the desktop client only.
default-members = ["."]

[dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
russh = { version = "0.65.1", features = ["aws-lc-rs"] }
russh-sftp = "3.0.1"
# Versions match the ones russh already pulls in (see Cargo.lock).
md5 = "0.8"
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
# Saved passwords: Windows Credential Manager / Secret Service / macOS Keychain.
keyring = "4"
# UDP download accelerator (client side and wire protocol).
rsftp-turbo-proto = { path = "crates/turbo-proto" }
vt100 = "0.18"
# Updates: GitHub release check and download, signature check (ed25519, already
# used by russh), unpacking the Linux .tar.gz, and replacing the running program.
ureq = "3"
ed25519-dalek = { version = "3", default-features = false }
flate2 = "1"
tar = { version = "0.4", default-features = false }
self-replace = "1"
